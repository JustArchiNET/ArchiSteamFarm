name: ASF-translations

on:
  schedule:
  - cron: '55 1 * * *'
  workflow_dispatch:

concurrency:
  group: ASF-translations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    environment: dev-crowdin
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        show-progress: false
        submodules: recursive
        token: ${{ secrets.ARCHIBOT_GITHUB_TOKEN }}

    - name: Reset wiki to follow origin
      shell: sh
      working-directory: wiki
      run: |
        set -eu

        git fetch origin master
        git reset --hard origin/master

    - name: Download latest translations from Crowdin
      uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
      with:
        upload_sources: false
        download_translations: true
        skip_untranslated_strings: true
        push_translations: false
        crowdin_branch_name: main
        config: '.github/crowdin.yml'
        project_id: ${{ secrets.ASF_CROWDIN_PROJECT_ID }}
        token: ${{ secrets.ASF_CROWDIN_API_TOKEN }}

    - name: Import GPG key for signing
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      with:
        gpg_private_key: ${{ secrets.ARCHIBOT_GPG_PRIVATE_KEY }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true

    - name: Commit and push the changes to wiki
      shell: sh
      working-directory: wiki
      run: |
        set -eu

        git add -A "locale"

        if ! git diff --cached --quiet; then
            git commit -m "Automatic translations update"

            attempt=1
            pushed=0

            while [ "$attempt" -le 3 ]; do
                if git push origin HEAD:master; then
                    pushed=1

                    break
                fi

                if [ "$attempt" -eq 3 ]; then
                    break
                fi

                git fetch origin master

                if ! git rebase origin/master; then
                    git rebase --abort
                    echo "Unable to rebase wiki translations onto origin/master." >&2

                    exit 1
                fi

                attempt=$((attempt + 1))
            done

            if [ "$pushed" -ne 1 ]; then
                echo "Unable to push wiki translations after ${attempt} attempts." >&2

                exit 1
            fi
        fi

    - name: Commit and push the changes to ASF
      shell: sh
      run: |
        set -eu

        git add -A "ArchiSteamFarm/Localization" "ArchiSteamFarm.OfficialPlugins.ItemsMatcher/Localization" "ArchiSteamFarm.OfficialPlugins.MobileAuthenticator/Localization" "ArchiSteamFarm.OfficialPlugins.SteamTokenDumper/Localization" "wiki"

        if ! git diff --cached --quiet; then
            git commit -m "Automatic translations update"

            attempt=1

            while [ "$attempt" -le 3 ]; do
                if git push origin HEAD:main; then
                    exit 0
                fi

                if [ "$attempt" -eq 3 ]; then
                    break
                fi

                git fetch origin main

                if ! git rebase origin/main; then
                    git rebase --abort
                    echo "Unable to rebase translations onto origin/main." >&2

                    exit 1
                fi

                attempt=$((attempt + 1))
            done

            echo "Unable to push translations after ${attempt} attempts." >&2

            exit 1
        fi
